<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912"><title>Zag Science</title>
<style>
:root{--bg:#070912;--card:#0c101b;--p:#c44cff;--line:#7130a4;--txt:#fff;--muted:#b9add0;--green:#25f3a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#211037,#070912 32%,#04060b);color:var(--txt);font-family:Arial,sans-serif}
.app{max-width:780px;margin:auto;padding-bottom:92px}header{text-align:center;padding:18px 12px 12px;border-bottom:1px solid #62258f;background:#080a12ee;position:sticky;top:0;z-index:5}
.brand{font-weight:1000;font-style:italic;font-size:clamp(27px,8vw,46px);letter-spacing:2px;text-shadow:0 0 15px #a33cff}.brand span{font-style:normal}.tag{font-size:9px;letter-spacing:4px;color:#c9a6ff;margin-top:6px}
main{padding:14px}.top{display:flex;align-items:center;gap:8px}.title{text-align:center;flex:1}.title h1{font-size:32px;margin:4px}.title p{color:#c69bff;margin:0}
button,select,input{font:inherit}.btn,.week{border:1px solid var(--p);background:#11101d;color:#fff;border-radius:11px;padding:9px 12px;box-shadow:0 0 9px #9d35ff44}
.exercise{margin:13px 0;border:1px solid var(--line);border-radius:14px;background:#0a0e18;overflow:hidden}.head{display:flex;gap:9px;align-items:center;padding:11px}.n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#351650;border:1px solid #884bc5}.name{font-weight:800;flex:1}.max{font-size:12px;color:#cdbce9;margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:center;padding:7px 3px;border-top:1px solid #202638}th{color:#bfb3d4;font-weight:500}.cell{width:57px;background:#080b12;color:white;border:1px solid #30374b;border-radius:6px;padding:6px;text-align:center}
.fist{border:0;background:transparent;font-size:24px;padding:1px 5px}.fist.done{filter:drop-shadow(0 0 7px #39ffb3);transform:scale(.9)}
.actions{display:grid;gap:12px;margin:18px 0}.all,.finish{border-radius:14px;padding:16px;color:#fff;font-weight:900;font-size:18px}.all{border:1px solid #e24dff;background:linear-gradient(90deg,#331046,#160a25);box-shadow:0 0 15px #ca3cff66}.flame{display:inline-grid;place-items:center;width:48px;height:40px;margin-right:8px;position:relative;font-size:29px}.flame:before{content:"🔥";position:absolute;font-size:42px;z-index:0}.flame:after{content:"🤙🏼";position:absolute;font-size:28px;z-index:1;transform:translateY(4px)}
.finish{border:1px solid #28ffac;background:linear-gradient(90deg,#063725,#07593d);box-shadow:0 0 14px #17e99755}
.extras{border:1px solid #5f2886;border-radius:14px;padding:14px;background:#090c14}.extra{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #202434}.extra span{flex:1}.note{font-size:12px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#080a12f4;border-top:1px solid #5c2585;padding-bottom:env(safe-area-inset-bottom);z-index:10}.navin{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:#c9a6ed;padding:12px 1px;font-size:11px}.nav b{display:block;font-size:20px}.nav .active{background:#32105288;color:#fff}
.pagecard{border:1px solid #57247e;border-radius:12px;padding:13px;margin:9px 0;background:#0b0e17}.danger{border-color:#ff4e7b}
@media(max-width:540px){th:nth-child(2),td:nth-child(2){display:none}.brand{letter-spacing:0}.top .btn{padding:8px}.title h1{font-size:27px}}
</style></head>
<body><div class="app"><header><div class="brand">ZAG SCIENCE <span>🧪</span></div><div class="tag">DISCIPLINE • PROGRESS • RESULTS</div></header><main id="screen"></main></div>
<div class="nav"><div class="navin"><button onclick="home()"><b>⌂</b>Home</button><button class="active" onclick="workout()"><b>🏋</b>Workout</button><button onclick="maxes()"><b>▥</b>Maxes</button><button onclick="historyPage()"><b>▤</b>History</button><button onclick="settings()"><b>⚙</b>Settings</button></div></div>
<script>
const warm=[[.2,20],[.4,8],[.6,5],[.75,3],[.9,2]];
const plans={1:[[.7,8],[.725,8],[.75,8],[.725,8],[.7,10]],2:[[.725,8],[.75,7],[.775,6],[.725,8],[.7,10]],3:[[.75,6],[.8,5],[.825,4],[.75,6],[.7,10]],4:[[.775,5],[.825,4],[.85,3],[.775,5],[.725,8]],5:[[.8,5],[.85,3],[.875,3],[.8,5],[.75,8]],6:[[.825,4],[.875,2],[.9,2],[.8,5]],7:[[.6,8],[.65,6],[.7,5]],8:[[.8,3],[.9,1],[.95,1],[1,1],[1.05,1]]};
const base=[
["Pull 1",["Weighted Lat Pull Up","Barbell Row","Free Weight Row","Close Pulldown B","Close Pulldown R","Straight Arm Pulldown"],["Advanced Lat Pull Down","Shrugs","Rear Delts","Smyth Shrug","Cable Shrug","Seated Rope High Row","Single Arm Low Cable Row","Laydown T Row"]],
["Push 1",["Shoulder Smyth Press","Decline Machine Press","Lateral Raise Pin","Cable Fly Pin","Pin Shoulder Blue","Front Raise Cable"],["Log Press","Stand Square BB Shoulder","Arnold DB","Single Lat Raise Pin","Single Arm DB Raise","Incline Smith","Bench","DB Press"]],
["Arms",["Tri Dips","DB Preacher Curl","Tri EZ Extension","Rope Curl","Single Rope Extension","Bicep Machine"],["Single Cable Curl","Single Spider","Double Rope Extension","Ski Rope Curl","Wide Pull Down B","Wide Pull Down R","Pin Close Row"]],
["Legs",["Deadlifts","Siting Hammy Curl","Leg Extension","Uni Press / Leg Press","Squats","Sitting Calfs"],["Hack Squat","Single Leg Press","Press Calf","Step Back Uni Press","Close And Far Hack","Red Leg Extension","Stiff Deads","Lying Curl"]],
["Pull 2",["Wide Pulldown B","Wide Pulldown R","Barbell Row","Free Weight Row","Advanced Lat Pull Down","Straight Arm Pulldown"],["Close Pulldown B","Close Pulldown R","Rear Delts","Shrugs","Weighted Lat Pull Up","Cable Shrug","T Bar Chest Pad Row"]],
["Chest 1",["Dumbell Flat","Incline Smyth","Cable Fly","Upward Cable Fly","Decline Chest Machine"],["Bench","Floor Bench","DB Fly","Decline Smyth","100 Blue","Plate Row"]],
["Shoulders 1",["Shoulder Smyth Machine","Log Press","Cable Side Raise","Close Grip Shoulder Machine Blue","Cable Front Raise","Rear Delt Machine","Shrugs"],["DB Arnold Press","Wrist Cable Side Raise","Stop Shoulder Smyth","Smyth Shrug","DB Front Raise","Single Pin Side Raise","Cable Shrug"]],
["Pull 1",["Weighted Lat Pull Up","Barbell Row","Free Weight Row","Close Pulldown B","Close Pulldown R","Straight Arm Pulldown"],["Advanced Lat Pull Down","Shrugs","Rear Delts","Smyth Shrug","Cable Shrug"]],
["Push 2",["Db press / bench","Cable Fly / pin","Lateral Raise / pin","Chest pin red / blue / incline","Front raise db / plate","Upward cable fly"],["Front Raise Cable Rope","Single Lat Raise","Single DB Raise Seat Paused","Bar Bench","DB Fly","Incline Smith","Flat Smith","Decline Smith"]],
["Arms",["Tri Dips","DB Preacher Curl","Tri EZ Extension","Rope Curl","Single Rope Extension","Bicep Machine"],["Single Cable Curl","Single Spider","Double Rope Extension","Pull Down B Wide Slow","Pin Row"]],
["Legs",["Deadlifts","Siting Hammy Curl","Leg Extension (R)","Hack Squat / Squat","Squats","Sitting Calfs"],["Press Calf","Stiff Deads","Lying Curl","Step Back Uni Press","Single Leg Press","Uni Press","Leg Press"]],
["Pull 2",["Wide Pulldown B","Wide Pulldown R","Barbell Row","Free Weight Row","Advanced Lat Pull Down","Straight Arm Pulldown"],["Close Pulldown B","Close Pulldown R","Rear Delts","Shrugs","Weighted Lat Pull Up"]],
["Shoulders 2",["Shoulder Smyth Machine","Log Press","Dumbell Side Raise","Close Grip Shoulder Machine Blue","Cable Front Raise","Rear Delt Machine","Shrugs"],["DB Front Raise","DB Arnold Press","Wrist Cable Side Raise","Stop Shoulder Smyth","Smyth Shrug","Single Arm DB Side Raise","Cable Shrug"]],
["Chest 2",["Dumbell Flat","Incline Smyth","Cable Fly","Upward Cable Fly","Incline Chest Machine"],["Bench","DB Fly","Decline Smyth","100 Blue"]]];
const seed={"Weighted Lat Pull Up":25,"Barbell Row":170,"Free Weight Row":100,"Close Pulldown B":225,"Close Pulldown R":230,"Advanced Lat Pull Down":150,"Straight Arm Pulldown":90,"Deadlifts":170,"Squats":100,"Sitting Calfs":100,"Tri Dips":129,"Bicep Machine":175};
let st=JSON.parse(localStorage.getItem("zagScienceV2")||"null")||{day:0,weeks:{},max:{...seed},draft:{},history:[],sound:true,days:base};
function save(){localStorage.setItem("zagScienceV2",JSON.stringify(st))}
function sets(ex){let m=+st.max[ex]||0,w=st.weeks[ex]||1;return warm.concat(plans[w]).map(x=>({p:x[0],r:x[1],kg:Math.round(m*x[0]*10)/10}))}
function k(ex,i){return st.day+"|"+ex+"|"+i} function q(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function clickSound(){if(!st.sound)return;let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=135;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.045);o.stop(a.currentTime+.05)}
function returnSound(){if(!st.sound)return;let a=new(window.AudioContext||window.webkitAudioContext)();[0,.06,.12].forEach((t,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=950-i*190;g.gain.setValueAtTime(.035,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.08);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.09)})}
function workout(){let d=st.days[st.day],s=`<div class=top><button class=btn onclick="move(-1)">‹ Back</button><div class=title><h1>${d[0]}</h1><p>Day ${st.day+1} of 14</p></div><button class=btn onclick="move(1)">Next ›</button></div>`;
d[1].forEach((ex,e)=>{let ts=sets(ex),w=st.weeks[ex]||1;s+=`<section class=exercise><div class=head><div class=n>${e+1}</div><div class=name>${ex}<div class=max>Max: ${st.max[ex]||0} kg</div></div><select class=week onchange="st.weeks['${q(ex)}']=+this.value;save();workout()">${[1,2,3,4,5,6,7,8].map(n=>`<option ${n==w?'selected':''}>${n}</option>`).join("")}</select></div><table><tr><th>Set</th><th>Target %</th><th>Target kg</th><th>Actual kg</th><th>Reps</th><th>Done</th></tr>`;
ts.forEach((t,i)=>{let v=st.draft[k(ex,i)]||{};s+=`<tr><td>${i<5?"W"+(i+1):i-4}</td><td>${Math.round(t.p*1000)/10}%</td><td>${t.kg}</td><td><input class=cell type=number inputmode=decimal value="${v.kg??""}" onchange="field('${q(k(ex,i))}','kg',this.value)"></td><td><input class=cell type=number inputmode=numeric value="${v.r??""}" placeholder="${t.r}" onchange="field('${q(k(ex,i))}','r',this.value)"></td><td><button class="fist ${v.done?'done':''}" onclick="one('${q(ex)}',${i})">👊🏼</button></td></tr>`});s+="</table></section>"});
s+=`<div class=actions><button class=all onclick=allSets()><span class=flame></span>COMPLETE ALL SETS</button><button class=finish onclick=finish()>✓ FINISH WORKOUT</button></div><section class=extras><h2>Extras / Replacements</h2>${d[2].map(x=>`<div class=extra><span>${x}</span><span class=note>Max</span><input class=cell type=number value="${st.max[x]||""}" onchange="st.max['${q(x)}']=+this.value;save()"><button class=btn onclick="swapPrompt('${q(x)}')">Swap</button></div>`).join("")}<button class=btn style="margin-top:12px" onclick=addEx()>+ Add Exercise</button></section>`;document.getElementById("screen").innerHTML=s}
function field(key,f,v){st.draft[key]=st.draft[key]||{};st.draft[key][f]=v;save()}
function one(ex,i){let key=k(ex,i),t=sets(ex)[i];if(st.draft[key]?.done)delete st.draft[key];else st.draft[key]={kg:t.kg,r:t.r,done:true};clickSound();save();workout()}
function allSets(){st.days[st.day][1].forEach(ex=>sets(ex).forEach((t,i)=>st.draft[k(ex,i)]={kg:t.kg,r:t.r,done:true}));clickSound();save();workout()}
function finish(){let d=st.days[st.day],rec={date:new Date().toLocaleString(),day:d[0],sets:[]},prs=[];d[1].forEach(ex=>sets(ex).forEach((t,i)=>{let v=st.draft[k(ex,i)];if(v&&v.kg&&v.r){rec.sets.push({exercise:ex,kg:+v.kg,reps:+v.r});if(+v.r>=t.r&&+v.kg>(st.max[ex]||0)){st.max[ex]=+v.kg;prs.push(ex+" "+v.kg+"kg")}}}));st.history.unshift(rec);st.draft={};save();returnSound();alert(prs.length?"Workout saved! New max: "+prs.join(", "):"Workout saved!");workout()}
function move(n){st.day=(st.day+n+14)%14;save();workout()}
function swapPrompt(extra){let mains=st.days[st.day][1],pick=prompt("Which main exercise number do you want to replace?\n"+mains.map((x,i)=>(i+1)+". "+x).join("\n"));let i=+pick-1;if(i>=0&&i<mains.length){let old=mains[i],j=st.days[st.day][2].indexOf(extra);mains[i]=extra;st.days[st.day][2][j]=old;save();workout()}}
function addEx(){let x=prompt("New exercise name:");if(!x)return;st.days[st.day][2].push(x);st.max[x]=+(prompt("Max weight (kg):")||0);save();workout()}
function home(){document.getElementById("screen").innerHTML=`<div class=title><h1>The Goat Split</h1><p>14-day rotation</p></div>${st.days.map((d,i)=>`<button class=btn style="width:100%;margin:5px 0;text-align:left" onclick="st.day=${i};save();workout()">Day ${i+1} — ${d[0]}</button>`).join("")}`}
function maxes(){let names=[...new Set(st.days.flatMap(d=>d[1].concat(d[2])))].sort();document.getElementById("screen").innerHTML=`<div class=title><h1>Max & History</h1></div>${names.map(x=>`<div class=pagecard><b>${x}</b><span style="float:right"><input class=cell type=number value="${st.max[x]||0}" onchange="st.max['${q(x)}']=+this.value;save()"> kg</span></div>`).join("")}`}
function historyPage(){document.getElementById("screen").innerHTML=`<div class=title><h1>Workout History</h1></div>${st.history.length?st.history.map(h=>`<div class=pagecard><b>${h.day}</b><div class=note>${h.date}</div>${h.sets.length} completed sets</div>`).join(""):"<p>No workouts saved yet.</p>"}`}
function settings(){document.getElementById("screen").innerHTML=`<div class=title><h1>Settings</h1></div><div class=pagecard>Sound <button class=btn style="float:right" onclick="st.sound=!st.sound;save();settings()">${st.sound?"On":"Off"}</button><br><br></div><div class=pagecard><button class=btn onclick=backup()>Export Backup</button> <label class=btn>Import Backup<input hidden type=file accept=.json onchange=restore(this)></label></div><div class=pagecard><button class="btn danger" onclick="if(confirm('Reset all Zag Science data?')){localStorage.removeItem('zagScienceV2');location.reload()}">Reset All Data</button></div>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:"application/json"}));a.download="zag-science-backup.json";a.click()}
function restore(x){let r=new FileReader();r.onload=()=>{try{st=JSON.parse(r.result);save();alert("Backup imported");settings()}catch(e){alert("Invalid backup file")}};r.readAsText(x.files[0])}
workout();
</script></body></html>
